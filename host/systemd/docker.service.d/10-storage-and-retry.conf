# /etc/systemd/system/docker.service.d/10-storage-and-retry.conf
# (installed from this repo: host/systemd/docker.service.d/)
[Unit]
# Containers bind-mount the mergerfs pool: never start them before it's mounted.
# (Already implied through local-fs.target; this keeps it true even if the
# fstab line ever gains `nofail`. Wants=, not Requires=, so if the pool disk
# dies, containers that don't need it still start.)
Wants=mnt-storage.mount
After=mnt-storage.mount mnt-disk2.mount
# Never give up restarting after a rough boot (default: give up after 3 tries in 60 s).
StartLimitIntervalSec=0

[Service]
RestartSec=10
