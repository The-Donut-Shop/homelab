# /etc/systemd/system/containerd.service.d/10-slow-disk.conf
# (installed from this repo: host/systemd/containerd.service.d/)
# After the 2026-11-25 power cut, opening containerd's metadata DB on the slow
# OS disk took over 90 s; systemd killed containerd mid-open twice, Docker failed
# once, and every container started ~4 minutes late. Give it time instead.
[Service]
TimeoutStartSec=10min
