# /etc/systemd/zram-generator.conf   (apt install systemd-zram-generator)
# Compressed swap in RAM. The OS disk is a slow 5400 rpm drive that also holds
# /swap.img; swapping to it made every app crawl after the 2026-11-25 power cut.
# zram compresses cold memory (~3:1 with zstd) in RAM instead. zram swap gets
# priority 100, so /swap.img (priority -2) is only used as overflow.
# Ubuntu 22.04 ships zram-generator 0.3.x, which uses these (older) key names.
[zram0]
# up to half of RAM worth of uncompressed pages (~3.9 GB), capped at 4 GiB
zram-fraction = 0.5
max-zram-size = 4096
compression-algorithm = zstd
