# Public resolvers only.
#
# The router hands out the ISP's resolver (DHCP and IPv6 RA). That resolver
# answers blocked torrent sites (1337x, EZTV, Torrent Downloads, ...) with a
# CNAME to the ISP's block page, whose TLS certificate doesn't match, so Prowlarr
# fails with RemoteCertificateNameMismatch. systemd-resolved sends each lookup to
# every link's DNS servers as well as these and takes the first answer, so the
# block page won whenever the router answered first. Domains=~. routes every
# name to the servers below. Names under the router's own search domain still
# go to the router, and Tailscale names to Tailscale.
[Resolve]
DNS=1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4
Domains=~.
FallbackDNS=8.8.8.8 8.8.4.4
DNSStubListener=yes
