# /etc/sysctl.d/91-inotify.conf
# More inotify watches. Immich watches every file in its external libraries
# (~120k entries) and hit the old per-user limit of 60,114: "ENOSPC: System
# limit for number of file watchers reached". A watch only costs kernel memory
# (~1 KB) while it is actually in use.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512
