# /etc/smartd.conf
# One line per disk, named by-id so a changed sdX order can't mix them up
# (`ls -l /dev/disk/by-id/ | grep ata-`). Replace the <...> placeholders.
#   -a             health, attributes, error and self-test logs
#   -S on          attribute autosave
#   -n standby,q   never spin up a sleeping disk just to check it
#   -W 4,45,55     log 4 C changes, warn at 45 C, critical at 55 C
#   -s (...)       short self-test daily 02:00, long self-test on the 1st of each month
#                  (monthly, not weekly: both in-use disks are old and the OS disk is slow)
#   -M exec        warnings go to /etc/smartmontools/run.d/* (add an ntfy/Telegram script there)

# OS disk (OS, Docker, app state)
/dev/disk/by-id/ata-<os-disk> -a -S on -n standby,q -s (S/../.././02|L/../01/./03) -W 4,45,55 -m root -M exec /usr/share/smartmontools/smartd-runner

# Pool data disk (/mnt/disk2) - known bad sectors, watch closely
/dev/disk/by-id/ata-<pool-disk> -a -S on -n standby,q -s (S/../.././02|L/../01/./05) -W 4,45,55 -m root -M exec /usr/share/smartmontools/smartd-runner

# Recovery disk (/mnt/recovery) - failing, holds an untouched data-recovery set:
# passive health/error-log monitoring only, never self-tested.
/dev/disk/by-id/ata-<recovery-disk> -H -l error -n standby,q -W 4,45,55 -m root -M exec /usr/share/smartmontools/smartd-runner
