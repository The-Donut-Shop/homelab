# /etc/smartd.conf
# Monitor all disks: health, attributes, error logs, self-test logs, temperature.
#   -a                 all standard checks
#   -o on -S on        automatic offline tests + attribute autosave
#   -n standby,q       don't wake sleeping disks just to check them
#   -s (...)           short self-test every day at 02:00, long test Saturdays at 03:00
#   -W 4,45,55         log temperature changes of 4°C, warn at 45°C, critical at 55°C
#   -M exec ...        hand warnings to smartd-runner (/etc/smartmontools/run.d/*):
#                      drop a script there to forward alerts to ntfy/Telegram/e-mail
DEVICESCAN -a -o on -S on -n standby,q -s (S/../.././02|L/../../6/03) -W 4,45,55 -m root -M exec /usr/share/smartmontools/smartd-runner
