# /etc/sysctl.d/92-zram.conf  (goes with zram-generator.conf)
# Swapping to zram is cheap (RAM); re-reading evicted files from the slow OS
# disk is not. So treat both equally instead of the default bias against swap.
vm.swappiness = 100
# zram has no seek cost: swap in single pages instead of 8-page clusters.
vm.page-cluster = 0
